name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out private repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter 3.41.4 from the official repository
        shell: bash
        run: |
          git clone --depth 1 --branch 3.41.4 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter
        shell: bash
        run: flutter --version

      - name: Resolve dependencies
        shell: bash
        run: flutter pub get

      - name: Check Dart formatting
        shell: bash
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze source
        shell: bash
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        shell: bash
        run: flutter build apk --debug --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneEntry-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
