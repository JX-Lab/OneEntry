name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: Publish channel
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out private repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter 3.41.4 from the official repository
        shell: bash
        run: |
          git clone --depth 1 --branch 3.41.4 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter
        shell: bash
        run: flutter --version

      - name: Resolve dependencies
        shell: bash
        run: flutter pub get

      - name: Read app version
        shell: bash
        run: |
          APP_VERSION="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          if [[ -z "$APP_VERSION" ]]; then
            echo "Unable to read version from pubspec.yaml" >&2
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Select release channel
        shell: bash
        env:
          REQUESTED_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_CHANNEL" == "stable" ]]; then
            echo "RELEASE_IS_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "RELEASE_CHANNEL_LABEL=Stable" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=release-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_IS_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "RELEASE_CHANNEL_LABEL=Preview" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=preview-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Check Dart formatting
        shell: bash
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze source
        shell: bash
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        shell: bash
        run: flutter test --no-pub

      - name: Configure stable release signing when secrets are available
        shell: bash
        env:
          ONEENTRY_KEYSTORE_BASE64: ${{ secrets.ONEENTRY_KEYSTORE_BASE64 }}
          ONEENTRY_KEY_ALIAS: ${{ secrets.ONEENTRY_KEY_ALIAS }}
          ONEENTRY_KEY_PASSWORD: ${{ secrets.ONEENTRY_KEY_PASSWORD }}
          ONEENTRY_STORE_PASSWORD: ${{ secrets.ONEENTRY_STORE_PASSWORD }}
        run: |
          if [[ -n "$ONEENTRY_KEYSTORE_BASE64" && -n "$ONEENTRY_KEY_ALIAS" && -n "$ONEENTRY_KEY_PASSWORD" && -n "$ONEENTRY_STORE_PASSWORD" ]]; then
            echo "$ONEENTRY_KEYSTORE_BASE64" | base64 --decode > android/app/oneentry-release.jks
            {
              echo "storeFile=oneentry-release.jks"
              echo "storePassword=$ONEENTRY_STORE_PASSWORD"
              echo "keyAlias=$ONEENTRY_KEY_ALIAS"
              echo "keyPassword=$ONEENTRY_KEY_PASSWORD"
            } > android/key.properties
            echo "BUILD_MODE=release" >> "$GITHUB_ENV"
          else
            echo "BUILD_MODE=debug" >> "$GITHUB_ENV"
          fi

      - name: Build smaller APKs by CPU architecture
        shell: bash
        run: flutter build apk --${BUILD_MODE} --split-per-abi --no-pub --build-name=${APP_VERSION} --build-number=${{ github.run_number }}

      - name: Upload split APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneEntry-${{ env.BUILD_MODE }}-split-apks
          path: build/app/outputs/flutter-apk/app-*-${{ env.BUILD_MODE }}.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OneEntry ${{ env.APP_VERSION }} (${{ env.RELEASE_CHANNEL_LABEL }} #${{ github.run_number }})
          prerelease: ${{ env.RELEASE_IS_PRERELEASE }}
          generate_release_notes: false
          body: |
            Version: ${{ env.APP_VERSION }}
            Build: ${{ github.run_number }}
            Channel: ${{ env.RELEASE_CHANNEL_LABEL }}
            APK signing: ${{ env.BUILD_MODE }}

            Choose the APK for your device:
            - `arm64-v8a`: most current Android phones and tablets
            - `armeabi-v7a`: older 32-bit Android devices
            - `x86_64`: Android emulators and x86 devices
          files: build/app/outputs/flutter-apk/app-*-${{ env.BUILD_MODE }}.apk
